spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymtracka}
    username: ${DB_USER:gym_user}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
auth:
  google-audience: ${GOOGLE_OAUTH_AUDIENCE:}
  encryption-key: ${AUTH_ENCRYPTION_KEY:}
  cleanup:
    fixed-delay-ms: ${AUTH_CLEANUP_FIXED_DELAY_MS:60000}
    initial-delay-ms: ${AUTH_CLEANUP_INITIAL_DELAY_MS:60000}
account:
  deletion:
    # Independent versioned HMAC ring for deletion-ledger digests, as JSON
    # {"activeVersion":"2","keys":{"1":"base64-32B",...}}. Absent by
    # default; lifecycle delete/status then fail closed without breaking
    # unrelated routes. No real secret value is stored here.
    ledger-keys: ${ACCOUNT_DELETION_LEDGER_KEYS:}
    purge:
      # Physical purge stays disabled by default; ordinary deletion remains
      # fail-closed until the section 11 release conditions are verified and
      # this flag is deliberately enabled. No production SLA is chosen here.
      enabled: ${ACCOUNT_DELETION_PURGE_ENABLED:false}
      fixed-delay-ms: ${ACCOUNT_DELETION_PURGE_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${ACCOUNT_DELETION_PURGE_INITIAL_DELAY_MS:60000}
      account-budget: ${ACCOUNT_DELETION_PURGE_ACCOUNT_BUDGET:20}
      row-budget: ${ACCOUNT_DELETION_PURGE_ROW_BUDGET:500}
sync:
  history:
    cleanup:
      enabled: ${SYNC_HISTORY_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${SYNC_HISTORY_CLEANUP_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${SYNC_HISTORY_CLEANUP_INITIAL_DELAY_MS:60000}
  snapshot:
    cleanup:
      enabled: ${SYNC_SNAPSHOT_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${SYNC_SNAPSHOT_CLEANUP_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${SYNC_SNAPSHOT_CLEANUP_INITIAL_DELAY_MS:60000}
